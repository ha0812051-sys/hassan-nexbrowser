<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Hassan Browser - Search the web and quickly open websites.">

    <meta name="author"
          content="Hassan">

    <title>Hassan Browser</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="brand">

            <div class="h-logo">
                H
            </div>

            <div>
                <h2>
                    Hassan <span>Browser</span>
                </h2>

                <small>
                    Search • Explore • Connect
                </small>
            </div>

        </div>


        <nav>
            <a href="#">⌂ Home</a>
            <a href="#history">🕘 History</a>
            <a href="#">ⓘ About</a>
        </nav>

    </header>



    <!-- MAIN -->

    <main>

        <!-- PROFILE PHOTO -->

        <img
            src="hassan.jpg"
            class="profile"
            alt="Hassan"
        >


        <h1>
            Hassan
        </h1>


        <div class="search-title">
            SEARCH
        </div>


        <p class="subtitle">
            🔎 Search the web or open any website
        </p>



        <!-- SEARCH BOX -->

        <div class="search-box">

            <span class="search-icon">
                🔍
            </span>

            <input
                type="text"
                id="website"
                placeholder="Type website or search..."
                autocomplete="off"
            >

            <button onclick="searchWeb()">
                🔍 Search
            </button>

        </div>


        <p class="hint">
            Try: Google • YouTube • Facebook • TikTok • Instagram
        </p>



        <!-- QUICK WEBSITES -->

        <div class="quick-links">
            <a target="_blank" href="https://www.google.com">
                <img src="google.png" alt="Google">     

            <button onclick="openSite('Google', 'https://www.google.com')">
                🌐
                <span>Google</span>
            </button>


            <button onclick="openSite('YouTube', 'https://www.youtube.com')">
                ▶️
                <span>YouTube</span>
            </button>


            <button onclick="openSite('Facebook', 'https://www.facebook.com')">
                f
                <span>Facebook</span>
            </button>


            <button onclick="openSite('TikTok', 'https://www.tiktok.com')">
                ♪
                <span>TikTok</span>
            </button>


            <button onclick="openSite('Instagram', 'https://www.instagram.com')">
                ◎
                <span>Instagram</span>
            </button>


            <button onclick="openSite('ChatGPT', 'https://chatgpt.com')">
                ◎
                <span>ChatGPT</span>
            </button>


            <button onclick="openSite('GitHub', 'https://github.com')">
                ●
                <span>GitHub</span>
            </button>


            <button onclick="openSite('Daraz', 'https://www.daraz.pk')">
                d
                <span>Daraz</span>
            </button>


            <button onclick="openSite('Netflix', 'https://www.netflix.com')">
                N
                <span>Netflix</span>
            </button>

        </div>



        <!-- SEARCH HISTORY -->

        <section
            class="history-section"
            id="history"
        >

            <div class="history-header">

                <h2>
                    🕘 Search History
                </h2>

                <button
                    class="clear-btn"
                    onclick="clearHistory()"
                >
                    🗑️ Clear All
                </button>

            </div>


            <div
                id="historyList"
                class="history-list"
            >
                <!-- History JavaScript se yahan show hogi -->
            </div>

        </section>

    </main>



    <!-- FOOTER -->

    <footer>

        <span>
            Made with ❤️ by <b>Hassan</b>
        </span>

        <span>
            © 2026 Hassan Browser
        </span>

    </footer>



    <script src="script.js"></script>

</body>

</html>
